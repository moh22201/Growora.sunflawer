name: Deploy Growora to GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static app
        run: bun run build

      - name: Prepare GitHub Pages files
        shell: bash
        run: |
          set -euo pipefail
          SITE_DIR=".output/public"
          if [ ! -d "$SITE_DIR" ]; then
            echo "Expected static output folder $SITE_DIR was not created."
            find . -maxdepth 3 -type d \( -name client -o -name public \) -print
            exit 1
          fi
          if [ ! -f "$SITE_DIR/index.html" ]; then
            echo "No index.html was produced in $SITE_DIR."
            ls -la "$SITE_DIR"
            exit 1
          fi
          cp "$SITE_DIR/index.html" "$SITE_DIR/404.html"
          touch "$SITE_DIR/.nojekyll"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
